    <div class="modal" id="imageModal" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" type="button" aria-label="Close preview">&times;</button>
            <div class="modal-image-wrap">
                <img id="modalImage" class="modal-image" src="" alt="Project screenshot preview" />
            </div>
            <div class="modal-caption">
                <h3 id="modalTitle">Project Screenshot</h3>
                <span class="modal-tag">Preview</span>
            </div>
        </div>

    <script>
        const requestedProject = new URLSearchParams(window.location.search).get('project');

        if (requestedProject === 'ateria') {
            document.getElementById('sms-gallery').hidden = true;
            document.getElementById('library-gallery').hidden = true;
            document.getElementById('guidance-gallery').hidden = true;
        }

        if (requestedProject === 'sms') {
            document.getElementById('ateria-gallery').hidden = true;
        }

        if (requestedProject === 'library') {
            document.getElementById('ateria-gallery').hidden = true;
            document.getElementById('sms-gallery').hidden = true;
            document.getElementById('guidance-gallery').hidden = true;
        }

        if (requestedProject === 'guidance') {
            document.getElementById('ateria-gallery').hidden = true;
            document.getElementById('sms-gallery').hidden = true;
            document.getElementById('library-gallery').hidden = true;
        }

        document.querySelectorAll('.gallery-grid').forEach((gallery) => {
            const originalCards = [...gallery.children];

            originalCards.forEach((card) => {
                gallery.appendChild(card.cloneNode(true));
            });

            gallery.classList.add('is-carousel');
        });

        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const closeButton = document.querySelector('.modal-close');

        document.querySelectorAll('.thumb-card').forEach((card) => {
            card.addEventListener('click', () => {
                modalImage.src = card.dataset.src;
                modalTitle.textContent = card.dataset.title;
                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            });
        });

        function closeModal() {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        closeButton.addEventListener('click', closeModal);

        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
